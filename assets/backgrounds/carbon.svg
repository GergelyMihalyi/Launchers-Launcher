<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131316"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <pattern id="lines" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="120" height="120" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#2a2a30" stroke-width="2" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3a3a44" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a3a44" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#lines)"/>
  <ellipse cx="960" cy="430" rx="900" ry="560" fill="url(#glow)" filter="url(#blur)"/>
</svg>
