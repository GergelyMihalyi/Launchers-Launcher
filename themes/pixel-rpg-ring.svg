       border-radius:50%, but a genuinely stepped, 8-bit circle outline, like the
       pixel font of the carousel-peek arrows. A thinner line + a finer (more, smaller
       cells) outline than the first version (r=7, 4x4 cells, 36 of them).
       The styles/*.css .card.focused .card-icon::after (pulse-ring keyframe: scale
